x-app: &app
  build:
    context: .
    dockerfile: infra/Dockerfile
  environment: &environment
    DATABASE_URL: postgres://loadlink:loadlink@postgres:5432/loadlink
    REDIS_URL: redis://redis:6379
    OSRM_URL: http://osrm:5000
    ORDER_SOURCE: fixture
    GOOGLE_ROUTES_KEY: ${GOOGLE_ROUTES_KEY:-}
    APP_URL: http://localhost:3000
    SESSION_SECRET: ${SESSION_SECRET:-local-compose-secret-change-before-production}
    EMAIL_PROVIDER: ${EMAIL_PROVIDER:-local}
    EMAIL_API_KEY: ${EMAIL_API_KEY:-}
    EMAIL_FROM: ${EMAIL_FROM:-}
    EMAIL_OUTBOX_DIR: /app/.local/mail
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: loadlink
      POSTGRES_PASSWORD: loadlink
      POSTGRES_DB: loadlink
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadlink"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
  osrm-data:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    entrypoint: /bin/sh
    command: ["-c", "test -f /data/region.osrm.partition || (osrm-extract -p /opt/car.lua /data/region.osm.pbf && osrm-partition /data/region.osrm && osrm-customize /data/region.osrm)"]
    volumes: ["./infra/osrm:/data"]
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: ["osrm-routed", "--algorithm", "mld", "/data/region.osrm"]
    depends_on:
      osrm-data: {condition: service_completed_successfully}
    volumes: ["./infra/osrm:/data"]
    ports: ["5000:5000"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/5000'"]
      interval: 10s
      retries: 20
  migrate:
    <<: *app
    command: ["npm", "run", "migrate"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    command: ["npm", "run", "dev", "--workspace=@loadlink/api"]
    ports: ["3001:3001"]
    environment:
      <<: *environment
      HOST: 0.0.0.0
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 20
  worker:
    <<: *app
    command: ["npm", "run", "dev", "--workspace=@loadlink/worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "const {Queue}=require('bullmq');const q=new Queue('sync-orders',{connection:{host:'redis',port:6379}});q.getWorkers().then(w=>process.exit(w.length?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 20
  web:
    <<: *app
    command: ["npm", "run", "dev", "--workspace=@loadlink/web"]
    ports: ["3000:3000"]
    environment:
      <<: *environment
      API_URL: http://api:3001
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 20
volumes:
  postgres-data:
