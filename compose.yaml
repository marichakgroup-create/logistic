services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: loadlink
      POSTGRES_PASSWORD: loadlink
      POSTGRES_DB: loadlink
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadlink"]
      interval: 5s
      retries: 20
  app:
    build:
      context: .
      dockerfile: infra/Dockerfile
    # Development login and approximate fixture routing for the local demo only.
    command: ["sh", "-c", "npm run migrate && npm run dev"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://loadlink:loadlink@postgres:5432/loadlink
      APP_URL: http://localhost:3000
      SESSION_SECRET: local-compose-secret-change-before-production
      ORDER_SOURCE: fixture
      ROUTING_MODE: fixture
      EMAIL_PROVIDER: local
    ports: ["3000:3000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 20
volumes:
  postgres-data:
